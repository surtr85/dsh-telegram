<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#0088FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2F6FF"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Radial Glow Accents -->
  <rect width="1200" height="420" rx="16" fill="url(#cyanGlow)"/>
  <rect width="1200" height="420" rx="16" fill="url(#purpleGlow)"/>
  <rect width="1200" height="420" rx="16" fill="url(#blueGlow)"/>

  <!-- Cyber Grid Pattern -->
  <g stroke="#38BDF8" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>

    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Hexagonal & Circuit Dots -->
  <g fill="#38BDF8" opacity="0.3">
    <circle cx="120" cy="120" r="2.5"/>
    <circle cx="360" cy="60" r="2"/>
    <circle cx="840" cy="180" r="2.5"/>
    <circle cx="960" cy="300" r="3"/>
    <circle cx="1080" cy="120" r="2"/>
  </g>

  <!-- Left Icon Emblem (Telegram Plane + AI Neural Nodes) -->
  <g transform="translate(100, 100)" filter="url(#dropShadow)">
    <!-- Hex / Outer Circle Neon Ring -->
    <circle cx="110" cy="110" r="94" fill="#0E1628" stroke="url(#accentLine)" stroke-width="2.5" opacity="0.85"/>
    <circle cx="110" cy="110" r="82" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.5"/>

    <!-- Neural Constellation Traces -->
    <path d="M 60 70 L 110 110 L 160 80 M 110 110 L 150 160 M 110 110 L 70 150" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="60" cy="70" r="3.5" fill="#00F2FE" opacity="0.7"/>
    <circle cx="160" cy="80" r="3" fill="#818CF8" opacity="0.7"/>
    <circle cx="150" cy="160" r="3" fill="#38BDF8" opacity="0.7"/>
    <circle cx="70" cy="150" r="3" fill="#7000FF" opacity="0.7"/>

    <!-- Telegram Paper Plane Vector -->
    <path d="M 62 108 L 158 64 L 138 156 L 102 124 L 62 108 Z" fill="url(#planeGrad)" filter="url(#glowFilter)"/>
    <path d="M 102 124 L 158 64 L 112 116 Z" fill="#E0F2FE" opacity="0.7"/>
    <path d="M 102 124 L 112 146 L 120 132 Z" fill="#0284C7"/>
  </g>

  <!-- Center Typography & Branding -->
  <g transform="translate(360, 115)">
    <!-- Top Super-header -->
    <text x="0" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#38BDF8">
      DEEPSEEK HARNESS • REMOTE AGENT PROTOCOL
    </text>

    <!-- Main Title -->
    <text x="0" y="98" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="url(#titleGrad)">
      dsh-telegram
    </text>

    <!-- Accent Underline Divider -->
    <rect x="0" y="118" width="480" height="3" rx="1.5" fill="url(#accentLine)"/>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="152" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      High-performance multimodal Telegram bridge &amp; telemetry control plane
    </text>
    <text x="0" y="178" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#64748B">
      Full bi-temporal context, live tool execution telemetry, token cache analytics &amp; model reasoning control
    </text>
  </g>

  <!-- Bottom Feature Pill Badges -->
  <g transform="translate(360, 325)">
    <!-- Badge 1: Multimodal Ingestion -->
    <g transform="translate(0, 0)">
      <rect width="170" height="32" rx="16" fill="#0F172A" stroke="url(#badgeBorder)" stroke-width="1"/>
      <text x="85" y="20.5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">
        📸 Multimodal Albums
      </text>
    </g>

    <!-- Badge 2: Live Tool Streaming -->
    <g transform="translate(182, 0)">
      <rect width="160" height="32" rx="16" fill="#0F172A" stroke="url(#badgeBorder)" stroke-width="1"/>
      <text x="80" y="20.5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#818CF8" text-anchor="middle">
        ⚙️ Tool Telemetry
      </text>
    </g>

    <!-- Badge 3: Reasoning Effort -->
    <g transform="translate(354, 0)">
      <rect width="180" height="32" rx="16" fill="#0F172A" stroke="url(#badgeBorder)" stroke-width="1"/>
      <text x="90" y="20.5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#A78BFA" text-anchor="middle">
        🧠 Reasoning Effort
      </text>
    </g>

    <!-- Badge 4: Nix Flake Native -->
    <g transform="translate(546, 0)">
      <rect width="150" height="32" rx="16" fill="#0F172A" stroke="url(#badgeBorder)" stroke-width="1"/>
      <text x="75" y="20.5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34D399" text-anchor="middle">
        ❄️ Nix Flake Native
      </text>
    </g>
  </g>

  <!-- Top Right Version Tag -->
  <g transform="translate(1060, 40)">
    <rect width="80" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="40" y="17" font-family="monospace" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">
      v1.0.0
    </text>
  </g>

  <!-- Outer Border Glow Line -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="url(#accentLine)" stroke-opacity="0.3" stroke-width="1"/>
</svg>
